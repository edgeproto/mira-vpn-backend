name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: mira-vpn-backend

      # Canonical wgmgr repo (not necessarily same GitHub org as this fork).
      - name: Checkout wgmgr (go.mod replace)
        uses: actions/checkout@v4
        with:
          repository: edgeproto/mira-vpn-wgmgr
          path: mira-vpn-wgmgr

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mira-vpn-backend/go.mod
          cache-dependency-path: mira-vpn-backend/go.sum

      - name: Run tests
        working-directory: mira-vpn-backend
        run: go test ./...

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: mira-vpn-backend

      - name: Checkout wgmgr (go.mod replace)
        uses: actions/checkout@v4
        with:
          repository: edgeproto/mira-vpn-wgmgr
          path: mira-vpn-wgmgr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f mira-vpn-backend/Dockerfile.api -t mira-vpn-backend-api:ci .
