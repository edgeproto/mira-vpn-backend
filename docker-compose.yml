services:
  # Reusing postgres_data keeps the superuser password from first init.
  # If POSTGRES_PASSWORD no longer matches, migrations/API get "password
  # authentication failed" and auth returns 500 — align env or ALTER USER, or
  # remove the volume (wipes DB).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mira_vpn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mira_vpn}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

  migrations:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./internal/db/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mira_vpn}?sslmode=disable",
        "up",
      ]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: mira-vpn-backend/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./config:/etc/mira-config:ro
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-mira_vpn}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-mira-vpn-api}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      WGMGR_TIMEOUT_SECONDS: ${WGMGR_TIMEOUT_SECONDS:-5}
      WGMGR_LOCATION_PROFILES_FILE: ${WGMGR_LOCATION_PROFILES_FILE:-/etc/mira-config/location-profiles.json}
      WGMGR_ADMIN_TOKEN_DEFAULT: ${WGMGR_ADMIN_TOKEN_DEFAULT:-}
      WGMGR_ADMIN_TOKEN_FINLAND: ${WGMGR_ADMIN_TOKEN_FINLAND:-}
      WGMGR_ADMIN_TOKEN_USA_COLORADO: ${WGMGR_ADMIN_TOKEN_USA_COLORADO:-}
    ports:
      - "${API_HOST_PORT:-18080}:8080"

volumes:
  postgres_data:
