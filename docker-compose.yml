services:
  # Reusing postgres_data keeps the superuser password from first init.
  # If POSTGRES_PASSWORD no longer matches, migrations/API get "password
  # authentication failed" and auth returns 500 — align env or ALTER USER, or
  # remove the volume (wipes DB).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mira_vpn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mira_vpn}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

  migrations:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./internal/db/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mira_vpn}?sslmode=disable",
        "up",
      ]
    restart: "no"

  wgmgr:
    build:
      context: .
      dockerfile: Dockerfile.wgmgr
    environment:
      PORT: 9090
      WGMGR_MODE: mock
      WGMGR_MOCK_OUTPUT_DIR: /data/wgmgr-mock
      WGMGR_MOCK_ENDPOINT: ${WGMGR_MOCK_ENDPOINT:-95.217.206.233:51820}
      WGMGR_MOCK_SERVER_PUBLIC_KEY: ${WGMGR_MOCK_SERVER_PUBLIC_KEY:-BB/7/1u13mBwC2kWQyEnKcuU1z9MChg3QiJjezAmujo=}
      WGMGR_MOCK_DNS: ${WGMGR_MOCK_DNS:-1.1.1.1}
      WGMGR_MOCK_ALLOWED_IPS: ${WGMGR_MOCK_ALLOWED_IPS:-0.0.0.0/0}
      WGMGR_CLIENT_MTU: ${WGMGR_CLIENT_MTU:-1280}
    volumes:
      - wgmgr_data:/data/wgmgr-mock

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      wgmgr:
        condition: service_started
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-mira_vpn}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-mira-vpn-api}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      WGMGR_BASE_URL: http://wgmgr:9090
      WGMGR_TIMEOUT_SECONDS: ${WGMGR_TIMEOUT_SECONDS:-5}
    ports:
      - "${API_HOST_PORT:-18080}:8080"

volumes:
  postgres_data:
  wgmgr_data:
