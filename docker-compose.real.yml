services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

  api:
    environment:
      PORT: ${API_HOST_PORT:-18080}
      DB_HOST: 127.0.0.1
      DB_PORT: ${POSTGRES_HOST_PORT:-15432}
      WGMGR_BASE_URL: http://127.0.0.1:9090
      WGMGR_TIMEOUT_SECONDS: ${WGMGR_TIMEOUT_SECONDS:-8}
      WGMGR_LOCATION_PROFILES_FILE: ${WGMGR_LOCATION_PROFILES_FILE:-}
      WGMGR_LOCATION_PROFILES_JSON: ${WGMGR_LOCATION_PROFILES_JSON:-}
    volumes:
      - ./config:/etc/mira-config:ro
    network_mode: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
